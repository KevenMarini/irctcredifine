<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCTC - Master List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        /* Content */
        .content-area { flex-grow: 1; overflow-y: auto; padding: 40px 48px; background: var(--paper); }
        
        h1 { font-family: var(--font-script); font-size: 48px; font-weight: normal; margin-bottom: 24px; line-height: 1; }
        h2 { font-size: 15px; font-weight: 700; margin-bottom: 24px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; }
        
        .ticket-list { display: flex; flex-direction: column; gap: 16px; max-width: 900px; }
        .ticket-card { border: 1px solid var(--line-strong); background: var(--surface); padding: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 4px 4px 0 rgba(51, 48, 59, 0.03); transition: border-color 0.15s; }
        .ticket-card:hover { border-color: var(--ink); }
        .ticket-pnr { font-family: var(--font-script); font-size: 26px; margin-bottom: 4px; color: var(--ink); }
        .ticket-details { font-size: 14px; line-height: 1.6; color: var(--ink-muted); }
        
        .card-actions { display: flex; gap: 8px; }
        .btn-view { border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 10px 18px; font-family: var(--font-grotesque); font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; box-shadow: 0 3px 0 var(--line-strong); transform: translateY(0); transition: transform 0.1s, box-shadow 0.1s; }
        .btn-view:hover { transform: translateY(1px); box-shadow: 0 2px 0 var(--line-strong); }
        .btn-view:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line-strong); }
        .btn-view.danger { border-color: var(--accent-red); color: var(--accent-red); background: #FEF2F2; box-shadow: 0 3px 0 #DC2626; }
        
        .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: var(--ink-muted); font-weight: 700; margin-bottom: 6px; }
        input[type="text"], input[type="number"], select { width: 100%; height: 42px; border: 1px solid var(--line-strong); background: var(--paper); padding: 0 14px; font-family: var(--font-grotesque); font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--accent-blush); background: var(--surface); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <a href="index.html" class="sidebar-logo">
            IRCTC <span class="badge-ir">OFFICIAL</span>
        </a>
        <ul class="nav-menu">
            <li class="nav-section" style="margin-top:0; border:none;"><div class="nav-label">My Account</div></li>
            <li><a href="profile.html" class="nav-item">My Bookings</a></li>
            <li><a href="master_list.html" class="nav-item active">Master List</a></li>
            <li><a href="loyalty.html" class="nav-item">Loyalty</a></li>
            <li><a href="wallet.html" class="nav-item">E-Wallet</a></li>
            <li class="nav-section"><div class="nav-label">Quick Links</div></li>
            <li><a href="index.html" class="nav-item">Book Ticket</a></li>
            <li><a href="trains.html" class="nav-item">Search Trains</a></li>
        </ul>
    </aside>

    <main class="main-wrapper">
        <header class="topbar">
            <button class="btn-back" onclick="history.back()">← Back</button>
            <div class="top-links">
                <span id="live-clock">18-Oct-2026 [14:49:04]</span>
                <span style="color: var(--line-strong);">|</span>
                <div class="font-size-ctrl">
                    <button onclick="IRCTC.setFontSize('13px')">A-</button>
                    <button onclick="IRCTC.setFontSize('14px')" class="active">A</button>
                    <button onclick="IRCTC.setFontSize('16px')">A+</button>
                </div>
                <span style="color: var(--line-strong);">|</span>
                <div id="header-user-slot"></div>
            </div>
        </header>

        <div class="content-area">
            <h1>Master List</h1>
            
            <h2>
                <span>Saved Passengers</span>
                <span id="passenger-count-badge" style="font-size:12px; font-weight:normal; color:var(--ink-muted);"></span>
            </h2>

            <div class="ticket-list" id="master-passenger-container">
                <!-- Injected dynamically -->
            </div>
            
            <button class="btn-primary" style="margin-top: 28px;" onclick="openPassengerModal()">+ Add New Passenger</button>
        </div>
    </main>

    <!-- Passenger Add/Edit Modal -->
    <div id="passenger-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="passenger-modal-title">Add New Passenger</div>
                <button class="modal-close" onclick="IRCTC.closeModal('passenger-modal')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="p-id">
                
                <div class="form-row">
                    <div>
                        <label>Full Name</label>
                        <input type="text" id="p-name" placeholder="As per Govt ID">
                    </div>
                    <div>
                        <label>Age</label>
                        <input type="number" id="p-age" min="1" max="120" placeholder="e.g. 34">
                    </div>
                    <div>
                        <label>Gender</label>
                        <select id="p-gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Transgender">Transgender</option>
                        </select>
                    </div>
                </div>

                <div class="form-row-2">
                    <div>
                        <label>Berth Preference</label>
                        <select id="p-berth">
                            <option value="No Preference">No Preference</option>
                            <option value="Lower">Lower</option>
                            <option value="Middle">Middle</option>
                            <option value="Upper">Upper</option>
                            <option value="Side Lower">Side Lower</option>
                            <option value="Side Upper">Side Upper</option>
                        </select>
                    </div>
                    <div>
                        <label>Food Preference</label>
                        <select id="p-food">
                            <option value="Veg">Vegetarian</option>
                            <option value="Non-Veg">Non-Vegetarian</option>
                            <option value="Jain Meal">Jain Meal</option>
                            <option value="No Food">No Food</option>
                        </select>
                    </div>
                </div>

                <div class="form-row-2">
                    <div>
                        <label>ID Card Type</label>
                        <select id="p-id-type">
                            <option value="Aadhar Card">Aadhaar Card</option>
                            <option value="PAN Card">PAN Card</option>
                            <option value="Passport">Passport</option>
                            <option value="Voter ID Card">Voter ID Card</option>
                            <option value="Driving License">Driving License</option>
                            <option value="Student ID / Birth Certificate">Student ID / Birth Certificate</option>
                        </select>
                    </div>
                    <div>
                        <label>ID Number</label>
                        <input type="text" id="p-id-number" placeholder="Card Number">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="IRCTC.closeModal('passenger-modal')">Cancel</button>
                <button class="btn-primary" onclick="savePassengerFromModal()">Save Passenger</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        function renderMasterList() {
            const list = IRCTC.getMasterList();
            const container = document.getElementById("master-passenger-container");
            document.getElementById("passenger-count-badge").textContent = `(${list.length} Passengers)`;

            if (list.length === 0) {
                container.innerHTML = `
                    <div style="background:var(--surface); border:1px solid var(--line-strong); padding:32px; text-align:center;">
                        <p style="color:var(--ink-muted); margin-bottom:12px;">No passengers saved yet in your Master List.</p>
                        <button class="btn-primary" onclick="openPassengerModal()">+ Add Your First Passenger</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(p => `
                <div class="ticket-card" id="card-${p.id}">
                    <div>
                        <div class="ticket-pnr">${p.name}</div>
                        <div class="ticket-details">
                            <strong style="color: var(--ink);">Age: ${p.age} | ${p.gender}</strong> &bull; Berth: <strong>${p.berthPreference || 'No Preference'}</strong><br>
                            ID: <strong>${p.idType}</strong> (${p.idNumber || 'Verified'})<br>
                            Status: <span style="color:var(--accent-sage); font-weight:700;">✓ Verified Passenger</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-view" onclick="editPassenger('${p.id}')">Edit</button>
                        <button class="btn-view danger" onclick="deletePassenger('${p.id}')">Delete</button>
                    </div>
                </div>
            `).join("");
        }

        function openPassengerModal(id = null) {
            document.getElementById("p-id").value = id || "";
            if (id) {
                const list = IRCTC.getMasterList();
                const p = list.find(item => item.id === id);
                if (p) {
                    document.getElementById("passenger-modal-title").textContent = "Edit Passenger Details";
                    document.getElementById("p-name").value = p.name;
                    document.getElementById("p-age").value = p.age;
                    document.getElementById("p-gender").value = p.gender;
                    document.getElementById("p-berth").value = p.berthPreference || "No Preference";
                    document.getElementById("p-food").value = p.foodPreference || "Veg";
                    document.getElementById("p-id-type").value = p.idType || "Aadhar Card";
                    document.getElementById("p-id-number").value = p.idNumber || "";
                }
            } else {
                document.getElementById("passenger-modal-title").textContent = "Add New Passenger";
                document.getElementById("p-name").value = "";
                document.getElementById("p-age").value = "";
                document.getElementById("p-gender").value = "Male";
                document.getElementById("p-berth").value = "No Preference";
                document.getElementById("p-food").value = "Veg";
                document.getElementById("p-id-type").value = "Aadhar Card";
                document.getElementById("p-id-number").value = "";
            }
            IRCTC.openModal("passenger-modal");
        }

        function editPassenger(id) {
            openPassengerModal(id);
        }

        function deletePassenger(id) {
            if (confirm("Are you sure you want to remove this passenger from your Master List?")) {
                IRCTC.deleteMasterPassenger(id);
                IRCTC.showToast("Passenger deleted from Master List", "info");
                renderMasterList();
            }
        }

        function savePassengerFromModal() {
            const id = document.getElementById("p-id").value;
            const name = document.getElementById("p-name").value.trim();
            const age = parseInt(document.getElementById("p-age").value);
            const gender = document.getElementById("p-gender").value;
            const berth = document.getElementById("p-berth").value;
            const food = document.getElementById("p-food").value;
            const idType = document.getElementById("p-id-type").value;
            const idNumber = document.getElementById("p-id-number").value.trim();

            if (!name) {
                IRCTC.showToast("Please enter passenger full name", "error");
                return;
            }
            if (!age || age <= 0 || age > 120) {
                IRCTC.showToast("Please enter a valid age", "error");
                return;
            }

            const passengerObj = {
                id: id || undefined,
                name: name.toUpperCase(),
                age: age,
                gender: gender,
                berthPreference: berth,
                foodPreference: food,
                idType: idType,
                idNumber: idNumber || "VERIFIED-ID",
                status: "Verified"
            };

            IRCTC.saveMasterPassenger(passengerObj);
            IRCTC.closeModal("passenger-modal");
            IRCTC.showToast(`Passenger ${passengerObj.name} saved successfully!`, "success");
            renderMasterList();
        }

        // Initialize list
        renderMasterList();
    </script>
</body>
</html>
